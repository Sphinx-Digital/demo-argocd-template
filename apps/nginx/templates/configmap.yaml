apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{{ .Values.homepage.title }}</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f172a;
          color: #e2e8f0;
          padding: 1rem;
        }
        .card {
          background: #1e293b;
          border: 1px solid #334155;
          border-radius: 1rem;
          padding: 2.5rem 2rem;
          max-width: 480px;
          width: 100%;
          text-align: center;
          box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .badge {
          display: inline-block;
          background: {{ .Values.homepage.color }};
          color: #0f172a;
          font-size: 0.7rem;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          padding: 0.25rem 0.75rem;
          border-radius: 999px;
          margin-bottom: 1.5rem;
        }
        h1 {
          font-size: 1.8rem;
          font-weight: 700;
          color: {{ .Values.homepage.color }};
          margin-bottom: 0.5rem;
        }
        .message {
          color: #94a3b8;
          font-size: 0.95rem;
          line-height: 1.6;
          margin-bottom: 2rem;
        }
        .steps {
          text-align: left;
          background: #0f172a;
          border-radius: 0.5rem;
          padding: 1.25rem;
          margin-bottom: 2rem;
        }
        .steps h2 {
          font-size: 0.8rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #64748b;
          margin-bottom: 0.75rem;
        }
        .step {
          display: flex;
          gap: 0.75rem;
          margin-bottom: 0.6rem;
          font-size: 0.875rem;
          color: #cbd5e1;
        }
        .step-num {
          flex-shrink: 0;
          width: 1.4rem;
          height: 1.4rem;
          background: {{ .Values.homepage.color }};
          color: #0f172a;
          border-radius: 50%;
          font-size: 0.7rem;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        code {
          background: #334155;
          padding: 0.1rem 0.4rem;
          border-radius: 0.25rem;
          font-size: 0.8rem;
          font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        .footer {
          border-top: 1px solid #334155;
          padding-top: 1.25rem;
          font-size: 0.8rem;
          color: #64748b;
        }
        .footer a {
          color: {{ .Values.homepage.color }};
          text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
        .dot { color: #334155; margin: 0 0.4rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="badge">🚀 Formation DevOps</div>
        <h1>Bonjour {{ .Values.prenom }} 👋</h1>
        <p class="message">{{ .Values.homepage.message }}</p>

        <div class="steps">
          <h2>Comment modifier cette page</h2>
          <div class="step">
            <span class="step-num">1</span>
            <span>Clonez votre repo GitHub et éditez <code>apps/nginx/values.yaml</code></span>
          </div>
          <div class="step">
            <span class="step-num">2</span>
            <span>Changez <code>homepage.message</code> ou <code>homepage.color</code></span>
          </div>
          <div class="step">
            <span class="step-num">3</span>
            <span>Commitez et pushez — ArgoCD redéploie en moins de 3 minutes</span>
          </div>
        </div>

        <div class="footer">
          <a href="https://sphinx-digital.com" target="_blank">sphinx-digital.com</a>
          <span class="dot">·</span>
          Formations · Consulting · DevOps
        </div>
      </div>
    </body>
    </html>
