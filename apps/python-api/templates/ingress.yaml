{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: python-api
    demo-user: {{ .Values.username }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.username }}-api.{{ .Values.domain }}
    secretName: {{ .Values.username }}-api-tls
  {{- end }}
  rules:
  - host: {{ .Values.username }}-api.{{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: python-api
            port:
              name: http
{{- end }}
